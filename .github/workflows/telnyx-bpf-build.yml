# Telnyx: build the Calico eBPF programs and (on demand) a calico-node image.
#
# Stage 1 (build-bpf) is the cheap gate: `make -C felix build-bpf` is the step
# that runs clang against the BPF target, so it proves a bpf-gpl change compiles.
# Stage 2 (node-image) is only worth running when you actually want to deploy;
# it builds the full node image and pushes it to ghcr.io.
#
# Runs on GitHub-hosted runners and pushes to ghcr.io, so nothing here depends on
# Telnyx infrastructure. To land the image in registry.internal.telnyx.com later,
# `crane copy` it from ghcr rather than teaching this workflow about the VPN.
name: telnyx-bpf-build

on:
  push:
    branches: ["telnyx/**"]
    paths:
      - "felix/bpf-gpl/**"
      - "felix/bpf/**"
      - "felix/Makefile"
      - "metadata.mk"
      - ".github/workflows/telnyx-bpf-build.yml"
  pull_request:
    branches: ["release-v3.32", "master"]
    paths:
      - "felix/bpf-gpl/**"
      - "felix/bpf/**"
  workflow_dispatch:
    inputs:
      build_image:
        description: "Also build and push the calico-node image to ghcr.io"
        type: boolean
        default: false
      build_all_images:
        description: "Build and stage every Linux image accepted by operator v1.42.6 (except the already-published node image)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-bpf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show build inputs
        run: |
          set -eux
          docker version
          grep -E '^(GO_VERSION|LLVM_VERSION|K8S_VERSION|GO_BUILD_VER)=' metadata.mk

      # libbpf is a separate source drop that build-bpf links against; without it
      # the BPF build fails on a missing libbpf.a (node/Makefile:242).
      - name: Clone libbpf
        run: make -C felix clone-libbpf

      - name: Build BPF programs
        run: make -C felix build-bpf ARCH=amd64

      - name: Show what was produced
        run: |
          set -eu
          ls -la felix/bpf-gpl/bin/ | head -30
          echo "object count: $(ls felix/bpf-gpl/bin/*.o 2>/dev/null | wc -l)"

      - uses: actions/upload-artifact@v4
        with:
          name: calico-bpf-objects-amd64
          path: felix/bpf-gpl/bin/*.o
          if-no-files-found: error
          retention-days: 14

  # Loads the real objects into the kernel, i.e. this is what puts the patch in
  # front of the actual eBPF verifier. Non-blocking at first: if the hosted
  # runners cannot do it, read the log and then decide whether to drop the job.
  bpf-ut:
    runs-on: ubuntu-latest
    needs: build-bpf
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Kernel / privilege check
        run: |
          set -eux
          uname -a
          docker run --rm --privileged alpine:3 sh -c 'echo privileged-ok'
      - name: Run BPF unit tests
        run: make -C felix ut-bpf

  node-image:
    if: github.event_name == 'workflow_dispatch' && inputs.build_image
    runs-on: ubuntu-latest
    needs: build-bpf
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      # The operator resolves images as <registry><imagePath>/node:<tag>, so
      # publishing under .../calico lets an Installation with
      # registry: ghcr.io/team-telnyx/ and the default imagePath find it.
      DEV_REGISTRIES: ghcr.io/team-telnyx/calico
      VALIDARCHES: amd64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The hosted runners ship with ~14GB free; the go-build image plus the
      # node image build needs more than that, so reclaim the preinstalled SDKs.
      - name: Free disk space
        run: |
          set -eux
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Compute image tag
        id: tag
        run: echo "tag=v3.32.2-telnyx-frag-${GITHUB_SHA::9}" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone libbpf
        run: make -C felix clone-libbpf

      - name: Build calico-node image
        run: make -C node image ARCH=amd64

      - name: Retag and push to ghcr.io
        run: |
          set -eux
          # CONFIRM=true is required: without it lib.Makefile:605-615 rewrites
          # DOCKER to `echo [DRY RUN] docker`, so the push silently does nothing
          # while every step still reports success.
          make -C node retag-build-images-with-registries push-images-to-registries \
            IMAGETAG=${{ steps.tag.outputs.tag }} \
            DEV_REGISTRIES="$DEV_REGISTRIES" \
            VALIDARCHES=amd64 \
            CONFIRM=true

      - name: Report the image reference
        run: |
          set -eux
          REF=ghcr.io/team-telnyx/calico/node:${{ steps.tag.outputs.tag }}
          # verify the manifest really exists rather than trusting the push step
          docker manifest inspect "$REF" > /dev/null
          echo "pushed and verified: $REF" >> "$GITHUB_STEP_SUMMARY"

  # Operator v1.42.6 is the operator shipped with Calico v3.32.2.  Its
  # config/calico_versions.yml is the authoritative component-name contract.
  # This matrix is the Linux/buildable intersection of that contract and this
  # repository's component Makefiles.  Windows images are intentionally out of
  # scope for this Linux eBPF patch, and node is preserved from the already-green
  # 6880df999 publication instead of being overwritten.
  all-images:
    if: github.event_name == 'workflow_dispatch' && inputs.build_all_images
    runs-on: ubuntu-latest
    needs: build-bpf
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - component: apiserver
            dir: apiserver
            images: apiserver
          - component: cni
            dir: cni-plugin
            images: cni
          - component: kube-controllers
            dir: kube-controllers
            images: kube-controllers
          - component: typha
            dir: typha
            images: typha
          - component: goldmane
            dir: goldmane
            images: goldmane
          - component: storage-drivers
            dir: pod2daemon
            images: pod2daemon-flexvol csi node-driver-registrar
          - component: key-cert-provisioner
            dir: key-cert-provisioner
            images: key-cert-provisioner
          - component: guardian
            dir: guardian
            images: guardian
          - component: whisker
            dir: whisker
            images: whisker
          - component: whisker-backend
            dir: whisker-backend
            images: whisker-backend
          - component: webhooks
            dir: webhooks
            images: webhooks
          - component: istio
            dir: istio
            images: istio-install-cni istio-pilot istio-proxyv2 istio-ztunnel
            make_args: ISTIO_ZTUNNEL_BASE_IMAGE=quay.io/calico/istio-ztunnel:v1.29.6-release-v3.32
          - component: envoy-gateway
            dir: third_party/envoy-gateway
            images: envoy-gateway
          - component: envoy-proxy
            dir: third_party/envoy-proxy
            images: envoy-proxy
          - component: envoy-ratelimit
            dir: third_party/envoy-ratelimit
            images: envoy-ratelimit
    env:
      SOURCE_SHA: 6880df999e3fe5a6d8606fe99f6f80c15b1702cb
      IMAGE_TAG: v3.32.2-telnyx-frag-6880df999
      STAGING_REGISTRY: ghcr.io/team-telnyx/calico
      COMPONENT_IMAGES: ${{ matrix.images }}
      MAKE_ARGS: ${{ matrix.make_args }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact product source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Configure upstream remote for generated-code checks
        run: git remote add projectcalico https://github.com/projectcalico/calico.git

      - name: Free disk space
        run: |
          set -eux
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this image set is already staged
        id: staged
        run: |
          set -eu
          missing=false
          for image in $COMPONENT_IMAGES; do
            if ! docker manifest inspect "$STAGING_REGISTRY/$image:$IMAGE_TAG" > /dev/null 2>&1; then
              missing=true
            fi
          done
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.component }} image set
        if: steps.staged.outputs.missing == 'true'
        run: |
          set -eux
          make -C "${{ matrix.dir }}" image ARCH=amd64 $MAKE_ARGS

      - name: Stage operator image names on ghcr.io
        if: steps.staged.outputs.missing == 'true'
        run: |
          set -eux
          for image in $COMPONENT_IMAGES; do
            source_ref="$image:latest-amd64"
            target_ref="$STAGING_REGISTRY/$image:$IMAGE_TAG"
            docker image inspect "$source_ref" > /dev/null
            docker tag "$source_ref" "$target_ref"
            docker push "$target_ref"
            docker manifest inspect "$target_ref" > /dev/null
            echo "$image -> $target_ref" >> "$GITHUB_STEP_SUMMARY"
          done
